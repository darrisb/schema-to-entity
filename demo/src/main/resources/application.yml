spring:
  application:
    name: schema-to-entity-demo
  datasource:
    # Overridden in Docker by SPRING_DATASOURCE_* environment variables.
    url: jdbc:postgresql://localhost:5433/dynamic_meta_db
    username: dynamic_meta_user
    password: dynamic_meta_password

server:
  port: 8080

schema-to-entity:
  enabled: true
  web-enabled: true
  # true here so the demo works locally.
  # Production must set to false or put behind authentication.
  explicit-connections-enabled: true
  schema: public
  # Host allowlist (empty = any host allowed, subject to other policy checks).
  # Supports exact match and "*.example.com" wildcard patterns.
  allowed-hosts: []
  # Allow H2 mem:/file: and other embedded databases (default: false).
  allow-embedded-databases: false
  # Maximum time to wait when establishing a connection (default: 10s).
  connect-timeout: 10s
  # Maximum idle time between two data packets (default: 60s).
  socket-timeout: 60s
  # Maximum number of concurrent schema extractions via explicit connections
  # (default: 4). Excess requests receive HTTP 429.
  max-concurrent-explicit-connections: 4
  # Read-only data API. The demo source is validated at startup but connects
  # lazily, so the application still starts when Postgres is not running.
  data-api-enabled: true
  max-page-size: 200
  default-page-size: 50
  query-timeout: 15s
  schema-cache-ttl: 10m
  # Origins allowed to call the read-only data API from a browser. This covers
  # /api/data/** only. Add the deployed UI origin for production.
  data-allowed-origins:
    - http://localhost:4200
  sources:
    demo:
      # Defaults target the compose Postgres on the host port; Docker sets
      # DEMO_DB_URL to the in-network address. Override the credentials in
      # production; never commit a real password.
      url: ${DEMO_DB_URL:jdbc:postgresql://localhost:5433/dynamic_meta_db}
      username: ${DEMO_DB_USERNAME:dynamic_meta_user}
      password: ${DEMO_DB_PASSWORD:dynamic_meta_password}
      schema: ${DEMO_DB_SCHEMA:public}
      max-pool-size: 4
