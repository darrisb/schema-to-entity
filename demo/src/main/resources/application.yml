spring:
  application:
    name: schema-to-entity-demo
  ai:
    mcp:
      server:
        name: schema-to-entity
        enabled: ${schema-to-entity.llm-enabled:${SCHEMA_TO_ENTITY_LLM_ENABLED:true}}
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
  datasource:
    # Overridden in Docker by SPRING_DATASOURCE_* environment variables.
    url: jdbc:postgresql://localhost:5433/dynamic_meta_db
    username: dynamic_meta_user
    password: dynamic_meta_password

server:
  port: 8080

schema-to-entity:
  enabled: true
  web-enabled: true
  # true here so the demo works locally.
  # Production must set to false or put behind authentication.
  explicit-connections-enabled: true
  schema: public
  # Host allowlist (empty = any host allowed, subject to other policy checks).
  # Supports exact match and "*.example.com" wildcard patterns.
  allowed-hosts: []
  # Allow H2 mem:/file: and other embedded databases (default: false).
  allow-embedded-databases: false
  # Maximum time to wait when establishing a connection (default: 10s).
  connect-timeout: 10s
  # Maximum idle time between two data packets (default: 60s).
  socket-timeout: 60s
  # Maximum number of concurrent schema extractions via explicit connections
  # (default: 4). Excess requests receive HTTP 429.
  max-concurrent-explicit-connections: 4
  # Read-only data API. The demo source is validated at startup but connects
  # lazily, so the application still starts when Postgres is not running.
  data-api-enabled: true
  max-page-size: 200
  default-page-size: 50
  query-timeout: 15s
  schema-cache-ttl: 10m
  # Combined schema document (graph). Requires data-api-enabled; off by
  # default in the starter. On here so the demo shows the document, the
  # cross-source proposals between the two sources below and the overlay
  # endpoints. See api/README.md ("Combined schema document").
  graph-enabled: true
  # The MCP server and the starter's LLM services share this switch.
  llm-enabled: ${SCHEMA_TO_ENTITY_LLM_ENABLED:true}
  # JSON file keeping the graph's overlay edits — labels, relationship
  # decisions, manual relationships. The only file the starter writes
  # itself; rediscovery never wipes it. A local file, so it is not shared
  # between instances.
  overlay-file: ${GRAPH_OVERLAY_FILE:./schema-overlay.json}
  # Drift detection (needs graph-enabled above): each source's accepted baseline
  # snapshot is kept here, with superseded ones under <dir>/history/<source>/.
  # A check only reads metadata; the only files written are these snapshots and,
  # on a confirmed rename, the overlay. In Docker this points at the same
  # mounted volume as the overlay so baselines survive a rebuild.
  snapshot-dir: ${SNAPSHOT_DIR:./snapshots}
  # Check every source for drift in the background once every 15m, starting one
  # interval after the application is ready. The starter leaves this unset, which
  # means nothing is checked on a timer and drift is only checked when a caller
  # asks (GET /api/graph/drift[?check=true]). See api/README.md, "Drift detection".
  drift-check-interval: 15m
  # Stored visual-ui page documents. The starter leaves this admin API off by
  # default. In Docker PAGES_DIR points at the persistent /data volume.
  pages-enabled: true
  pages-dir: ${PAGES_DIR:./pages}
  # Browser origins allowed to use /api/pages/**. This is the visual-ui
  # examples and builder development server.
  page-allowed-origins:
    - http://localhost:5173
  # Origins allowed to call the read-only data API from a browser. This covers
  # /api/data/** only. The console is served by the API itself (same origin,
  # no CORS needed). Add the deployed UI origin for production.
  data-allowed-origins:
    - http://localhost:5173   # UI library examples (Vite dev server)
  sources:
    demo:
      # Defaults target the compose Postgres on the host port; Docker sets
      # DEMO_DB_URL to the in-network address. Override the credentials in
      # production; never commit a real password.
      url: ${DEMO_DB_URL:jdbc:postgresql://localhost:5433/dynamic_meta_db}
      username: ${DEMO_DB_USERNAME:dynamic_meta_user}
      password: ${DEMO_DB_PASSWORD:dynamic_meta_password}
      schema: ${DEMO_DB_SCHEMA:public}
      max-pool-size: 4
    billing:
      # Second demo source: the billing schema in the same compose Postgres,
      # created by db/init/02-billing.sql. Having two sources is what makes
      # the graph propose cross-source relationships; those proposals stay
      # "proposed" until confirmed through the overlay endpoints.
      url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5433/dynamic_meta_db}
      username: ${BILLING_DB_USERNAME:dynamic_meta_user}
      password: ${BILLING_DB_PASSWORD:dynamic_meta_password}
      schema: ${BILLING_DB_SCHEMA:billing}
      max-pool-size: 4
