services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dynamic_meta_db
      POSTGRES_USER: dynamic_meta_user
      POSTGRES_PASSWORD: dynamic_meta_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamic_meta_user -d dynamic_meta_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator?currentSchema=public
      SPRING_DATASOURCE_USERNAME: orchestrator
      SPRING_DATASOURCE_PASSWORD: orchestrator
      # Read-only data API demo source, pointing at the bundled Postgres.
      DEMO_DB_URL: jdbc:postgresql://database:5432/dynamic_meta_db
      DEMO_DB_USERNAME: dynamic_meta_user
      DEMO_DB_PASSWORD: dynamic_meta_password
      DEMO_DB_SCHEMA: public
      # Second demo source: the billing schema in the same Postgres
      # (created by db/init/02-billing.sql). Two sources give the graph
      # document its cross-source proposals.
      BILLING_DB_URL: jdbc:postgresql://database:5432/dynamic_meta_db
      BILLING_DB_USERNAME: dynamic_meta_user
      BILLING_DB_PASSWORD: dynamic_meta_password
      BILLING_DB_SCHEMA: billing
      # Graph overlay edits live on a volume so they survive rebuilds.
      GRAPH_OVERLAY_FILE: /data/schema-overlay.json
      # Drift baselines (one JSON snapshot per source, plus <dir>/history) on the
      # same /data volume, so an accepted baseline survives a rebuild too.
      SNAPSHOT_DIR: /data/snapshots
    volumes:
      # Mounted volume for /data/schema-overlay.json and /data/snapshots.
      - overlay_data:/data
    ports:
      - "8081:8080"
    networks: [default, orchestrator]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

networks:
  orchestrator:
    external: true
    name: development-orchestrator_default
volumes:
  postgres_data:
  overlay_data:
