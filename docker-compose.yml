services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dynamic_meta_db
      POSTGRES_USER: dynamic_meta_user
      POSTGRES_PASSWORD: dynamic_meta_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamic_meta_user -d dynamic_meta_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator?currentSchema=public
      SPRING_DATASOURCE_USERNAME: orchestrator
      SPRING_DATASOURCE_PASSWORD: orchestrator
    ports:
      - "8081:8080"
    networks: [default, orchestrator]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

networks:
  orchestrator:
    external: true
    name: development-orchestrator_default
volumes:
  postgres_data:
